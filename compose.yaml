services:
  backend:
    image: cpp-backend:local
    build:
      context: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      LISTEN_HOST: 0.0.0.0
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
